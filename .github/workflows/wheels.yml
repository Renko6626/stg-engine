name: wheels

on:
  push:
    tags: ["rl-v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, id: linux-x86_64 }
          - { os: windows-latest, id: win-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: build wheel (linux, manylinux_2_28)
        if: runner.os == 'Linux'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release -m crates/stg-py/Cargo.toml --out dist
          manylinux: 2_28
      - name: build wheel (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: pip install "maturin>=1.15,<2" && maturin build --release -m crates/stg-py/Cargo.toml --out dist
      - name: smoke test on installed wheel
        shell: bash
        run: |
          python -m pip install numpy pytest dist/*.whl
          cd "$RUNNER_TEMP" && python -m pytest -q "$GITHUB_WORKSPACE/crates/stg-py/tests"
      - uses: actions/upload-artifact@v4
        with: { name: "wheel-${{ matrix.id }}", path: dist/*.whl }

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/rl-v')
    runs-on: ubuntu-24.04
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: dist/*.whl }
