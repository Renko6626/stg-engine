[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "stg-rl"
version = "0.3.0"
description = "stg-engine batched reinforcement-learning environment (proto v1 observations)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch"]
test = ["pytest>=7"]

[tool.maturin]
module-name = "stg_rl._native"
python-source = "python"
features = ["extension-module"]
